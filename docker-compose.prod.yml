# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Passing -f explicitly means docker-compose.override.yml (dev) is NOT loaded.
services:
  postgres:
    restart: always
    ports: !override []   # no host exposure in prod

  rabbitmq:
    restart: always
    ports: !override []   # no host exposure in prod

  gateway:
    restart: always
    ports: !override []   # reached only via the web nginx proxy

  aggregator:
    restart: always

  poll-ingester:
    restart: always

  commission-ingester:
    restart: always

  results-ingester:
    restart: always

  scheduler:
    restart: always
    # Check the Commission des sondages registry every 3h (not just 06:00/18:00)
    # so a notice filed during the day is picked up the same day.
    environment:
      CRON_SPEC: "0 */3 * * *"

  web:
    restart: always
    # Port 8090 so it coexists with the existing site (medlog.tech) on 80/443.
    ports: !override
      - "8090:80"
