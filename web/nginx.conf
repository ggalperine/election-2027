server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the gateway service (docker network name).
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }
}
